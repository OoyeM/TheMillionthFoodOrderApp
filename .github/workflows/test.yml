name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit & BFF Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/backend/TheMillionthFoodOrderApp.slnx

      - name: Build
        run: dotnet build src/backend/TheMillionthFoodOrderApp.slnx -c Release --no-restore

      - name: Unit tests
        run: dotnet run --project src/backend/TheMillionthFoodOrderApp.Tests.Unit -c Release --no-build -- --report-trx

      - name: BFF tests
        run: dotnet run --project src/backend/TheMillionthFoodOrderApp.Bff.Tests -c Release --no-build -- --report-trx

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/backend/TheMillionthFoodOrderApp.slnx

      - name: Build
        run: dotnet build src/backend/TheMillionthFoodOrderApp.slnx -c Release --no-restore

      - name: Integration tests
        run: dotnet run --project src/backend/TheMillionthFoodOrderApp.Tests.Integration -c Release --no-build -- --report-trx
